name: Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "!main"

permissions:
  contents: write

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      USE_ALIYUN_MIRROR: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:lintDebug --stacktrace
        continue-on-error: false

      - name: Build debug APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopOnAndroid-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.APK
          if-no-files-found: error